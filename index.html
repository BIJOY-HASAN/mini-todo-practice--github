
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>My Task Manager</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Enter a task">
      <button type="submit">Add Task</button>
    </form>
    <p id="task-count">Tasks: 0</p>
    <p id="remaining-count">Remaining: 0</p>
    <button id="clear-all">Clear All Tasks</button>
    <ul id="todo-list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
